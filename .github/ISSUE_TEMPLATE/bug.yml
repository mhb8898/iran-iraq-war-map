name: Something is broken
description: The map doesn't load, looks wrong, or a button doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw. A screenshot helps a lot.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15 / Safari, or Windows / Chrome
    validations:
      required: false
